name: Deploy Emergix Infrastructure

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          
      - name: Install Monorepo Dependencies
        run: npm install
        
      - name: Enforce Lint Strictness
        run: npm run lint --if-present
        
      - name: Execute Tests
        run: npm test --if-present

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials Pipeline
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR Docker Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Microservice Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/emergix/sos-service:latest -f infra/docker/Dockerfile.node --build-arg SERVICE_PATH=services/sos-service .
          docker push $ECR_REGISTRY/emergix/sos-service:latest
          
          docker build -t $ECR_REGISTRY/emergix/ai-service:latest -f infra/docker/Dockerfile.python services/ai-service
          docker push $ECR_REGISTRY/emergix/ai-service:latest
          
          # Iterate specific loops mapped to remaining tier-1 objects directly...

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Task Definition Overrides to ECS
        run: echo "Initiating automatic pull overrides linking container artifacts downstream into ECS cluster logic layers utilizing injected environment secrets"
