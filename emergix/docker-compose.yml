version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: emergix-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: emergix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - emergix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: emergix-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - emergix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: emergix-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - emergix-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  sos-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_PATH: services/sos-service
    container_name: emergix-sos-service
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - emergix-network

  tracking-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_PATH: services/tracking-service
    container_name: emergix-tracking-service
    env_file: .env
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emergix-network

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_PATH: services/notification-service
    container_name: emergix-notification-service
    env_file: .env
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - emergix-network

  ai-service:
    build:
      context: services/ai-service
      dockerfile: ../../infra/docker/Dockerfile.python
    container_name: emergix-ai-service
    env_file: .env
    ports:
      - "3003:3003"
    networks:
      - emergix-network

  admin-dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_PATH: apps/admin-dashboard
    container_name: emergix-dashboard
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - emergix-network

volumes:
  pgdata:
  redisdata:
  mongodata:

networks:
  emergix-network:
    driver: bridge
